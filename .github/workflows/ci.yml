name: CI

on:
  push:
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'  # bridge test needs the built-in WebSocket (Node >= 22)

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pyinstaller

      - name: Crypto round-trip proof (E2E primitives on this OS)
        run: python backend/tests/t_crypto.py

      - name: Install frontend dependencies
        run: |
          npm ci
          # npm >=11.19 gates dependency install scripts (allowScripts is
          # advisory); fetch the Electron runtime binary explicitly so any
          # runner npm version gets a working binary.
          node node_modules/electron/install.js

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (electron-vite)
        run: npx electron-vite build

      - name: Companion web build + bridge auth flow (Phase 1)
        run: |
          npx vite build --config vite.web.config.ts
          node scripts/test-bridge.mjs

      - name: Security suite (130 checks, fresh live instances)
        run: backend/tests/run_all.sh

      - name: Build frozen backend (PyInstaller)
        run: ./build-backend.sh

      - name: Frozen backend smoke
        run: SYNCFLOW_SMOKE_FROZEN="backend/dist/syncflow-backend/syncflow-backend" python backend/tests/smoke_windows.py

  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pyinstaller

      - name: Crypto round-trip proof (E2E primitives on this OS)
        run: python backend/tests/t_crypto.py

      - name: Source backend smoke (start + WS round-trip)
        run: python backend/tests/smoke_windows.py

      - name: Build frozen backend (PyInstaller)
        shell: bash
        run: ./build-backend.sh

      - name: Frozen backend smoke
        shell: bash
        run: SYNCFLOW_SMOKE_FROZEN="backend/dist/syncflow-backend/syncflow-backend.exe" python backend/tests/smoke_windows.py

  smoke-macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pyinstaller

      - name: Crypto round-trip proof (E2E primitives on this OS)
        run: python backend/tests/t_crypto.py

      - name: Source backend smoke (start + WS round-trip)
        run: python backend/tests/smoke_windows.py

      - name: Build frozen backend (PyInstaller)
        run: ./build-backend.sh

      - name: Frozen backend smoke
        run: SYNCFLOW_SMOKE_FROZEN="backend/dist/syncflow-backend/syncflow-backend" python backend/tests/smoke_windows.py
