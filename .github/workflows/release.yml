# Tag-driven release pipeline:
#   git tag v1.0.0 && git push origin v1.0.0
# → builds Linux (AppImage/deb/rpm), Windows (NSIS + portable),
#   macOS (dmg Intel + Apple Silicon) on their native runners
# → SHA256SUMS.txt + provenance attestations
# → creates a DRAFT GitHub Release (human verifies, then publishes)
#
# workflow_dispatch runs the builds only (dry run — no release created).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # older glibc → wider distro compatibility
            backend_bin: syncflow-backend
            builder_args: -l AppImage deb rpm
          - os: windows-latest
            backend_bin: syncflow-backend.exe
            builder_args: -w
          # macOS needs two NATIVE jobs — PyInstaller can't cross-compile, and
          # the arm64 runner's "x64" toolcache python still runs arm64 slices.
          - os: macos-latest        # Apple Silicon
            backend_bin: syncflow-backend
            mac_arch: arm64
            backend_arch: arm64
          - os: macos-15-intel      # Intel (native x86_64 runner; macos-13 is retired)
            backend_bin: syncflow-backend
            mac_arch: x64
            backend_arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify tag matches package.json version
        if: startsWith(github.ref_name, 'v')
        shell: bash
        run: |
          VER="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$VER" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $VER" >&2
            exit 1
          fi

      - name: Install backend dependencies
        if: runner.os != 'macOS'
        shell: bash
        run: pip install -r backend/requirements.txt pyinstaller

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Security suite (Linux only)
        if: runner.os == 'Linux'
        run: backend/tests/run_all.sh

      - name: Build renderer + main (electron-vite)
        run: npx electron-vite build

      - name: Build frozen backend (PyInstaller)
        if: runner.os != 'macOS'
        shell: bash
        run: ./build-backend.sh

      - name: Frozen backend smoke
        if: runner.os != 'macOS'
        shell: bash
        run: SYNCFLOW_SMOKE_FROZEN="backend/dist/syncflow-backend/${{ matrix.backend_bin }}" python backend/tests/smoke_windows.py

      - name: Install rpm tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build installers (Windows/Linux)
        if: runner.os != 'macOS'
        shell: bash
        env:
          # Never search for signing identities — all release artifacts are unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # --publish never: we attach files to the release ourselves later;
        # electron-builder must not try to upload (needs a separate GH_TOKEN)
        run: npx electron-builder ${{ matrix.builder_args }} --publish never

      # macOS: one native arch per job (macos-latest = arm64, macos-15-intel = x86_64)
      - name: "macOS: backend deps"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          PY="${pythonLocation}/bin/python"
          "$PY" -c "import sys,os; print('diag exe:',sys.executable); print('diag prefix:',sys.prefix); print('diag PYTHONHOME:',repr(os.environ.get('PYTHONHOME'))); print('diag sys.path[:4]:',sys.path[:4])"
          env -u PYTHONHOME PYTHONPATH= "$PY" -m pip install -r backend/requirements.txt pyinstaller

      - name: "macOS: build + smoke backend"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          PY="${pythonLocation}/bin/python"
          env -u PYTHONHOME PYTHONPATH= PYTHON="$PY" ./build-backend.sh
          BIN="backend/dist/syncflow-backend/${{ matrix.backend_bin }}"
          # cryptography's wheel ships its own OpenSSL; if an older image/Homebrew
          # libssl was collected instead, the frozen backend dies at startup with
          # "Symbol not found" — overwrite with the wheel's copies
          VEND=$(env -u PYTHONHOME PYTHONPATH= "$PY" -c "import cryptography.hazmat.bindings as b,os; d=os.path.join(os.path.dirname(b.__file__),'.dylibs'); print(d if os.path.isdir(d) else '')")
          shopt -s nullglob
          DYLIBS=("$VEND"/*.dylib)
          if [ ${#DYLIBS[@]} -gt 0 ]; then
            cp -f "${DYLIBS[@]}" backend/dist/syncflow-backend/_internal/
            echo "vendored OpenSSL synced from $VEND"
          else
            echo "::warning::no vendored cryptography .dylibs found at '$VEND'"
          fi
          file "$BIN"
          file "$BIN" | grep -q "${{ matrix.backend_arch }}" || { echo "::error::backend is not ${{ matrix.backend_arch }}"; exit 1; }
          SYNCFLOW_SMOKE_FROZEN="$BIN" env -u PYTHONHOME PYTHONPATH= "$PY" backend/tests/smoke_windows.py

      - name: "macOS: build dmg"
        if: runner.os == 'macOS'
        shell: bash
        env:
          # Never search for signing identities — all release artifacts are unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --${{ matrix.mac_arch }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-files
          merge-multiple: true

      - name: Tidy release files (drop update metadata)
        run: |
          cd release-files
          find . -name '*.blockmap' -delete
          find . -name 'latest*.yml' -delete
          find . -name '*.yml' -delete
          ls -la

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-files
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum | sed 's|\./||g' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: "Attest build provenance (verify with gh attestation verify)"
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-files/**'

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "SyncFlow $GITHUB_REF_NAME" \
            --generate-notes \
            release-files/*
