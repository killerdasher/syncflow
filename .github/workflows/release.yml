# Tag-driven release pipeline:
#   git tag v1.0.0 && git push origin v1.0.0
# → builds Linux (AppImage/deb/rpm), Windows (NSIS + portable),
#   macOS (dmg Intel + Apple Silicon) on their native runners
# → SHA256SUMS.txt + provenance attestations
# → creates a DRAFT GitHub Release (human verifies, then publishes)
#
# workflow_dispatch runs the builds only (dry run — no release created).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # older glibc → wider distro compatibility
            backend_bin: syncflow-backend
            builder_args: -l AppImage deb rpm
          - os: windows-latest
            backend_bin: syncflow-backend.exe
            builder_args: -w
          - os: macos-latest
            backend_bin: syncflow-backend
            # no builder_args: macOS builds both archs in dedicated steps below
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify tag matches package.json version
        if: startsWith(github.ref_name, 'v')
        shell: bash
        run: |
          VER="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$VER" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $VER" >&2
            exit 1
          fi

      - name: Install backend dependencies
        if: runner.os != 'macOS'
        shell: bash
        run: pip install -r backend/requirements.txt pyinstaller

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Security suite (Linux only)
        if: runner.os == 'Linux'
        run: backend/tests/run_all.sh

      - name: Build renderer + main (electron-vite)
        run: npx electron-vite build

      - name: Build frozen backend (PyInstaller)
        if: runner.os != 'macOS'
        shell: bash
        run: PYTHON=python ./build-backend.sh

      - name: Frozen backend smoke
        if: runner.os != 'macOS'
        shell: bash
        run: SYNCFLOW_SMOKE_FROZEN="backend/dist/syncflow-backend/${{ matrix.backend_bin }}" python backend/tests/smoke_windows.py

      - name: Install rpm tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build installers (Windows/Linux)
        if: runner.os != 'macOS'
        shell: bash
        env:
          # Never search for signing identities — all release artifacts are unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # --publish never: we attach files to the release ourselves later;
        # electron-builder must not try to upload (needs a separate GH_TOKEN)
        run: npx electron-builder ${{ matrix.builder_args }} --publish never

      # macOS needs TWO passes: the runner is arm64, so the backend built with
      # the default Python only runs on Apple Silicon. Pass 1 builds the arm64
      # backend + dmg, then we switch to x64 Python (Rosetta) and rebuild both
      # so the Intel dmg contains a native Intel backend.
      - name: "macOS: backend deps (Apple Silicon pass)"
        if: runner.os == 'macOS'
        shell: bash
        run: pip install -r backend/requirements.txt pyinstaller

      - name: "macOS: build + smoke arm64 backend"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          PYTHON=python ./build-backend.sh
          SYNCFLOW_SMOKE_FROZEN="backend/dist/syncflow-backend/${{ matrix.backend_bin }}" python backend/tests/smoke_windows.py

      - name: "macOS: build Apple Silicon dmg"
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: "macOS: switch to Intel (x64) Python"
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: "macOS: backend deps (Intel pass)"
        if: runner.os == 'macOS'
        shell: bash
        run: pip install -r backend/requirements.txt pyinstaller

      - name: "macOS: build + smoke x64 backend"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          PYTHON=python ./build-backend.sh
          SYNCFLOW_SMOKE_FROZEN="backend/dist/syncflow-backend/${{ matrix.backend_bin }}" python backend/tests/smoke_windows.py

      - name: "macOS: build Intel dmg"
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # Drop the arm64 unpacked dir so electron-builder repackages the
        # x64 electron + the freshly built Intel backend (keeps the dmg from pass 1)
        run: |
          rm -rf dist/mac*
          npx electron-builder --mac dmg --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-files
          merge-multiple: true

      - name: Tidy release files (drop update metadata)
        run: |
          cd release-files
          find . -name '*.blockmap' -delete
          find . -name 'latest*.yml' -delete
          find . -name '*.yml' -delete
          ls -la

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-files
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum | sed 's|\./||g' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: "Attest build provenance (verify with gh attestation verify)"
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-files/**'

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "SyncFlow $GITHUB_REF_NAME" \
            --generate-notes \
            release-files/*
